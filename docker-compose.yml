# Local production-like stack: the app on Postgres.
# Usage:  docker compose up --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: royalsmarket
      POSTGRES_USER: royals
      POSTGRES_PASSWORD: change-me
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U royals -d royalsmarket"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://db:5432/royalsmarket
      DB_USERNAME: royals
      DB_PASSWORD: change-me
    ports:
      - "8080:8080"

volumes:
  pgdata:
