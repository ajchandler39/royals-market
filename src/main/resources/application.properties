spring.application.name=royalsmarket

# Honor a PORT env var when provided (preview/hosting), else default to 8080.
server.port=${PORT:8080}

# ---- Database: H2 file-based (dev) ----
spring.datasource.url=jdbc:h2:file:./data/royalsmarket;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# ---- JPA / Hibernate ----
# Flyway owns the schema (see src/main/resources/db/migration); Hibernate must not touch it.
spring.jpa.hibernate.ddl-auto=none
# Server-rendered Thymeleaf views touch lazy associations (e.g. listing.seller)
# during rendering, so keep the session open for the view.
spring.jpa.open-in-view=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ---- H2 console (dev only) at /h2-console ----
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---- Thymeleaf (no template cache in dev) ----
spring.thymeleaf.cache=false

# ---- Auction sweep interval (ms) ----
royalsmarket.auction.close-interval-ms=60000
