# Production profile: PostgreSQL via environment variables.
# Run with: --spring.profiles.active=prod  (and DB_URL / DB_USERNAME / DB_PASSWORD set)

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# Flyway: allow adopting an existing (pre-Flyway) database without failing.
spring.flyway.baseline-on-migrate=true

# Disable dev-only tooling in production.
spring.h2.console.enabled=false
spring.thymeleaf.cache=true
