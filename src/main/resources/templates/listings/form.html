<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Sell an item')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>

<main class="container container-narrow">
    <div class="panel"
         th:with="postUrl=${editing} ? @{/listings/{id}/edit(id=${listingId})} : @{/listings}">
        <h1 th:text="${editing} ? 'Edit listing' : 'List an item'">List an item</h1>

        <form th:action="${postUrl}" th:object="${form}" method="post" class="stack"
              th:attr="x-data=|listingForm('${form.type}')|" x-init="syncItem($refs.itemSel)">

            <!-- Item picker -->
            <div>
                <label for="catalogItemId">Item</label>
                <select id="catalogItemId" th:field="*{catalogItemId}" required
                        x-ref="itemSel" x-on:change="syncItem($event.target)">
                    <option value="" disabled>— choose an item —</option>
                    <optgroup th:each="cat : ${allCategories}" th:label="${cat.label}">
                        <option th:each="item : ${catalogItems}" th:if="${item.category == cat}"
                                th:value="${item.id}"
                                th:attr="data-stats=${#strings.setJoin(item.applicableStats(), ',')},data-gear=${item.gear}"
                                th:text="${item.itemClass != null} ? ${item.name} + ' (' + ${item.itemClass.label} + ')' : ${item.name}">Item</option>
                    </optgroup>
                </select>
                <div class="field-error" th:if="${#fields.hasErrors('catalogItemId')}" th:errors="*{catalogItemId}"></div>
                <div class="hint">Pick the item you're selling. Stat fields below adjust to the item type.</div>
            </div>

            <!-- Stats (gear only; each field shows only if it applies to the chosen item) -->
            <div x-show="gear" x-cloak>
                <label>Stats <span class="hint">(fill in what applies; leave blank for 0)</span></label>
                <div class="stat-grid">
                    <div th:each="stat : ${allStats}" th:attr="x-show=|stats.includes('${stat}')|" x-cloak>
                        <label th:text="${stat.label}" style="margin:0 0 0.2rem">STR</label>
                        <input type="number" th:field="*{stats[__${stat}__]}" placeholder="0"/>
                    </div>
                </div>
            </div>

            <!-- Slots (gear only) -->
            <div x-show="gear" x-cloak>
                <label for="slotsRemaining">Upgrade slots remaining</label>
                <input id="slotsRemaining" type="number" th:field="*{slotsRemaining}" min="0" placeholder="e.g. 7"/>
            </div>

            <div>
                <label for="quantity">Quantity</label>
                <input id="quantity" type="number" th:field="*{quantity}" min="1" value="1"/>
            </div>

            <div>
                <label for="description">Notes (optional)</label>
                <textarea id="description" th:field="*{description}" maxlength="2000"
                          placeholder="Anything the structured fields don't cover (obscure stats, trade preferences…)"></textarea>
            </div>

            <div>
                <label for="imageUrl">Image URL (optional)</label>
                <input id="imageUrl" type="url" th:field="*{imageUrl}"
                       placeholder="https://i.imgur.com/your-screenshot.png"/>
                <div class="hint">Paste a link to a screenshot (e.g. imgur). Uploads aren't supported yet.</div>
            </div>

            <hr class="divider"/>

            <div>
                <label>Listing type</label>
                <select th:field="*{type}" x-model="type" th:disabled="${editing}">
                    <option value="SALE">Fixed-price sale</option>
                    <option value="AUCTION">Timed auction</option>
                </select>
                <div class="hint" th:if="${editing}">Listing type can't be changed after creation.</div>
            </div>

            <!-- SALE fields -->
            <template x-if="type === 'SALE'">
                <div>
                    <div>
                        <label for="price">Price (mesos)</label>
                        <input id="price" type="number" th:field="*{price}" min="100000000" step="1000000" placeholder="100000000"/>
                        <div class="hint">Minimum 100,000,000 mesos — RoyalsMarket is for high-value trades.</div>
                        <div class="field-error" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div>
                    </div>
                    <div class="checkbox-row">
                        <input id="allowOffers" type="checkbox" th:field="*{allowOffers}"/>
                        <label for="allowOffers">Accept best offers</label>
                    </div>
                </div>
            </template>

            <!-- AUCTION fields -->
            <template x-if="type === 'AUCTION'">
                <div>
                    <div>
                        <label for="startPrice">Starting bid (mesos)</label>
                        <input id="startPrice" type="number" th:field="*{price}" min="100000000" step="1000000" placeholder="100000000"/>
                        <div class="hint">Minimum 100,000,000 mesos.</div>
                        <div class="field-error" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div>
                    </div>
                    <div>
                        <label for="buyNowPrice">Buy-now price (optional)</label>
                        <input id="buyNowPrice" type="number" th:field="*{buyNowPrice}" min="100000000" step="1000000"
                               placeholder="Leave blank for none"/>
                        <div class="field-error" th:if="${#fields.hasErrors('buyNowPrice')}" th:errors="*{buyNowPrice}"></div>
                    </div>
                    <div th:if="${!editing}">
                        <label for="durationHours">Auction length</label>
                        <select id="durationHours" th:field="*{durationHours}">
                            <option value="6">6 hours</option>
                            <option value="12">12 hours</option>
                            <option value="24" selected>1 day</option>
                            <option value="72">3 days</option>
                            <option value="168">7 days</option>
                        </select>
                    </div>
                </div>
            </template>

            <button type="submit" class="btn btn-gold btn-block" style="margin-top:1.4rem"
                    th:text="${editing} ? 'Save changes' : 'Post listing'">Post listing</button>
        </form>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
