<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Log in')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>

<main class="container container-narrow">
    <div class="panel">
        <h1>Log in</h1>

        <div th:if="${param.registered}" class="flash flash-ok">Account created — please log in.</div>
        <div th:if="${param.error}" class="flash flash-err">Invalid username or password.</div>
        <div th:if="${param.logout}" class="flash flash-ok">You have been logged out.</div>

        <form th:action="@{/login}" method="post" class="stack">
            <div>
                <label for="username">Username</label>
                <input id="username" name="username" type="text" autofocus required/>
            </div>
            <div>
                <label for="password">Password</label>
                <input id="password" name="password" type="password" required/>
            </div>
            <button type="submit" class="btn btn-gold btn-block" style="margin-top:1.2rem">Log in</button>
        </form>
        <p class="hint" style="margin-top:1rem">
            No account? <a th:href="@{/register}">Sign up</a>
        </p>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
