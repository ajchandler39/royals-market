name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test
        # Docker is available on GitHub-hosted runners, so the Testcontainers
        # PostgreSQL integration test runs here (it is skipped locally without Docker).
        run: |
          chmod +x mvnw
          ./mvnw -B --no-transfer-progress verify
